apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shy-garlic.fullname" . }}
  labels:
    {{- include "shy-garlic.labels" . | nindent 4 }}
spec:
  # SQLite on a ReadWriteOnce volume: exactly one pod, and the old one must be
  # gone before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "shy-garlic.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "shy-garlic.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: shy-garlic
          image: {{ include "shy-garlic.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - -config
            - /data/config/shygarlic.yaml
            - -addr
            - ":8080"
          env:
            - name: SHYG_CONFIG
              value: /data/config/shygarlic.yaml
            - name: SHYG_DATA
              value: /data/shygarlic.db
            # seeds /data/config on first start; an existing config is never touched
            - name: SHYG_SEED_CONFIG
              value: /seed/shygarlic.yaml
            {{- with .Values.trustedProxy }}
            - name: SHYG_TRUSTED_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.allowedHosts }}
            - name: SHYG_ALLOWED_HOSTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if include "shy-garlic.adminSecretName" . }}
            - name: SHYG_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "shy-garlic.adminSecretName" . }}
                  key: {{ if .Values.admin.existingSecret }}{{ .Values.admin.existingSecretUserKey }}{{ else }}SHYG_ADMIN_USER{{ end }}
            - name: SHYG_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "shy-garlic.adminSecretName" . }}
                  key: {{ if .Values.admin.existingSecret }}{{ .Values.admin.existingSecretPasswordKey }}{{ else }}SHYG_ADMIN_PASSWORD{{ end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet: {path: /healthz, port: http}
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            # the initial config, copied to /data/config by --seed-config on first start
            - name: seed
              mountPath: /seed
              readOnly: true
            # The app and git want a writable $HOME/tmp on a read-only rootfs.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "shy-garlic.fullname" .) }}
        - name: seed
          configMap:
            name: {{ include "shy-garlic.fullname" . }}-seed
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
