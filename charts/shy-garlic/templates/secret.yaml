{{- if and (not .Values.admin.existingSecret) .Values.admin.username .Values.admin.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shy-garlic.fullname" . }}-admin
  labels:
    {{- include "shy-garlic.labels" . | nindent 4 }}
type: Opaque
stringData:
  SHYG_ADMIN_USER: {{ .Values.admin.username | quote }}
  SHYG_ADMIN_PASSWORD: {{ .Values.admin.password | quote }}
{{- end }}
