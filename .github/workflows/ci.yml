name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      - run: go vet ./...
      - run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      # Ten sam sposób budowania co w wydaniu — żeby błąd kompilacji dla
      # innej architektury nie wyszedł dopiero przy tagowaniu.
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/shyg
