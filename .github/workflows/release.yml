name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # tworzenie Release i wgrywanie plików
  packages: write   # publikacja obrazu na GHCR

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Zbuduj binarki
        run: |
          set -euo pipefail
          WERSJA="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for cel in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64; do
            GOOS="${cel%/*}"; GOARCH="${cel#*/}"
            # -trimpath usuwa ścieżki budowania, więc binarka nie niesie
            # układu katalogów maszyny, na której powstała
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -trimpath -ldflags="-s -w -X main.wersja=${WERSJA}" \
              -o "dist/shyg" ./cmd/shyg
            tar -czf "dist/shyg_${WERSJA}_${GOOS}_${GOARCH}.tar.gz" -C dist shyg
            rm dist/shyg
          done
          cd dist && sha256sum *.tar.gz > checksums.txt

      - name: Wydanie
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  obraz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN wystarcza do GHCR — zero sekretów do rotowania.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # ! --target git jest konieczny. Etap `git` jest ostatni w Dockerfile,
      # więc build bez celu i tak dałby jego — ale jawny target broni przed
      # tym, że ktoś przestawi kolejność etapów i po cichu wyda distroless
      # bez gita, przez co przestaną działać commity configu.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: git
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
