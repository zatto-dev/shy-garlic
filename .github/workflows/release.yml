name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # creating the Release and uploading files
  packages: write   # publishing the image to GHCR

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Build binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            # -trimpath strips build paths, so the binary does not carry
            # the directory layout of the machine it was built on
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/shyg" ./cmd/shyg
            tar -czf "dist/shyg_${VERSION}_${GOOS}_${GOARCH}.tar.gz" -C dist shyg
            rm dist/shyg
          done
          cd dist && sha256sum *.tar.gz > checksums.txt

      # gh is preinstalled on the runner. Our own command instead of a third-party
      # action is one dependency less in the supply chain — and one thing
      # less to pin and audit.
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            dist/*

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # GITHUB_TOKEN is enough for GHCR — no secrets to rotate.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # ! --target git is required. The `git` stage is the last one in the Dockerfile,
      # so a build without a target would give it anyway — but an explicit target guards
      # against someone reordering the stages and silently shipping distroless
      # without git, which would break the config commits.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: git
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Visibility guard. A GHCR package created by a workflow in an organization
      # is PRIVATE by default, and GitHub has no API to change that — it is done
      # only in the UI. Without this step the release looks successful, while `docker pull`
      # without login gives `unauthorized` (issue #1). We check the pull fully
      # anonymously: our own token without authentication, plain curl, no actions.
      - name: Check anonymous image pull
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          tag="${TAG#v}"
          fail() {
            echo "::error title=Private image::Image ghcr.io/${repo}:${tag} cannot be pulled anonymously ($1) — the image is private, change visibility in the package settings: https://github.com/orgs/${repo%%/*}/packages/container/${repo#*/}/settings (Danger Zone → Change visibility → Public)"
            exit 1
          }
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])') \
            || fail "no anonymous token"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/${repo}/manifests/${tag}")
          [ "$code" = "200" ] || fail "HTTP ${code}"
          echo "OK: ghcr.io/${repo}:${tag} is public"

  # Helm chart as OCI at ghcr.io/zatto-dev/charts/shy-garlic. The chart version
  # and appVersion come from the tag, so `helm install ... --version X` gives
  # exactly the image that came out in the same release.
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Helm (pinned version + checksum)
        run: .github/scripts/install-helm.sh

      - name: Package and push the chart
        env:
          TAG: ${{ github.ref_name }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          helm lint charts/shy-garlic --set "image.tag=${version}"
          helm package charts/shy-garlic --version "$version" --app-version "$version" --destination dist
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
          helm push "dist/shy-garlic-${version}.tgz" "oci://ghcr.io/${owner}/charts"

      # The same guard as for the image: the chart package is also created as
      # PRIVATE and visibility is changed only in the UI.
      - name: Check anonymous chart pull
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${owner}/charts/shy-garlic"
          tag="${TAG#v}"
          fail() {
            echo "::error title=Private chart::Chart oci://ghcr.io/${repo}:${tag} cannot be pulled anonymously ($1) — the package is private, change visibility in the package settings: https://github.com/orgs/${owner}/packages/container/charts%2Fshy-garlic/settings (Danger Zone → Change visibility → Public)"
            exit 1
          }
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])') \
            || fail "no anonymous token"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/${repo}/manifests/${tag}")
          [ "$code" = "200" ] || fail "HTTP ${code}"
          echo "OK: oci://ghcr.io/${repo}:${tag} is public"
