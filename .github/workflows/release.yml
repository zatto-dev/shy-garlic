name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # tworzenie Release i wgrywanie plików
  packages: write   # publikacja obrazu na GHCR

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Zbuduj binarki
        run: |
          set -euo pipefail
          WERSJA="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for cel in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64; do
            GOOS="${cel%/*}"; GOARCH="${cel#*/}"
            # -trimpath usuwa ścieżki budowania, więc binarka nie niesie
            # układu katalogów maszyny, na której powstała
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -trimpath -ldflags="-s -w -X main.wersja=${WERSJA}" \
              -o "dist/shyg" ./cmd/shyg
            tar -czf "dist/shyg_${WERSJA}_${GOOS}_${GOARCH}.tar.gz" -C dist shyg
            rm dist/shyg
          done
          cd dist && sha256sum *.tar.gz > checksums.txt

      # gh jest preinstalowany na runnerze. Własne polecenie zamiast obcej
      # akcji to o jedną zależność w łańcuchu dostaw mniej — i o jedną rzecz
      # mniej do przypinania i audytowania.
      - name: Wydanie
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            dist/*

  obraz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # GITHUB_TOKEN wystarcza do GHCR — zero sekretów do rotowania.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # ! --target git jest konieczny. Etap `git` jest ostatni w Dockerfile,
      # więc build bez celu i tak dałby jego — ale jawny target broni przed
      # tym, że ktoś przestawi kolejność etapów i po cichu wyda distroless
      # bez gita, przez co przestaną działać commity configu.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: git
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
