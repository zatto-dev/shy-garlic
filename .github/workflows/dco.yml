name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          missing=0
          # --no-merges: on pull_request HEAD is the synthetic merge commit GitHub creates
          for sha in $(git rev-list --no-merges "origin/${BASE_REF}..HEAD"); do
            author=$(git log -1 --format='%an' "$sha")
            if [ "$author" = "dependabot[bot]" ]; then
              continue
            fi
            if ! git log -1 --format='%B' "$sha" | grep -qi '^Signed-off-by:'; then
              echo "::error::Commit ${sha} is missing a Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit "$missing"
