{{define "login.html" -}}
<!doctype html>
<html lang="{{.Lang}}" data-preset="{{.Wyglad.Preset}}" data-ton="{{.Wyglad.Ton}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>{{.Tytuł}} — Shy Garlic</title>
<link rel="stylesheet" href="/assets/style.css">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/favicon-180.png">
</head>
<body class="brama">

<!-- ── warstwa tła ────────────────────────────────────────────────────── -->
<!-- Tu nie ma app.js, więc tło musi działać samym CSS-em z atrybutów <html>.
     Nigdy nie ma tu tapety: serwer podstawia preset, a /bg/ stoi za logowaniem. -->
<div id="tlo" aria-hidden="true">
  <div class="tlo-warstwa">
    <div class="tlo-blob"></div>
    <div class="tlo-blob"></div>
    <div class="tlo-blob"></div>
    <div class="tlo-blob"></div>
    <div class="tlo-ziarno"></div>
  </div>
</div>

<main class="brama-karta">
  <img src="/assets/logo.png" alt="" width="64" height="64" class="logo">
  <h1>Shy Garlic</h1>
  {{if .Setup}}
    <p class="brama-opis">{{.T.opis_setup}}</p>
  {{else}}
    <p class="brama-opis">{{.T.opis_logowania}}</p>
  {{end}}

  {{if .Błąd}}<p class="brama-blad" role="alert">{{.Błąd}}</p>{{end}}

  <form method="post" action="{{if .Setup}}/setup{{else}}/login{{end}}" autocomplete="on">
    <input type="hidden" name="next" value="{{.Next}}">
    <label>
      <span>{{.T.login}}</span>
      <input name="login" value="{{.Login}}" required autofocus autocomplete="username"
             autocapitalize="none" spellcheck="false">
    </label>
    <label>
      <span>{{.T.haslo}}</span>
      <input name="password" type="password" required
             autocomplete="{{if .Setup}}new-password{{else}}current-password{{end}}"
             {{if .Setup}}minlength="8"{{end}}>
    </label>
    {{if .Setup}}<p class="brama-podpowiedz">{{.T.min_8}}</p>{{end}}
    <button type="submit" class="btn btn--primary btn--lg">{{if .Setup}}{{.T.zaloz_konto}}{{else}}{{.T.zaloguj}}{{end}}</button>
  </form>

  <p class="brama-jezyk">
    <a href="/lang?set={{.DrugiJezyk}}" rel="nofollow"
       title="{{.T.jezyk}}: {{.DrugiJezykNazwa}}" aria-label="{{.T.jezyk}}: {{.DrugiJezykNazwa}}"
       >{{.DrugiJezykKrotko}}</a>
  </p>

  <p class="brama-stopka">Shy Garlic {{.Wersja}}</p>
</main>
</body>
</html>
{{- end}}
